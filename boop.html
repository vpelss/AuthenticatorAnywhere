//See https://blog.davidvassallo.me/2019/01/25/exploring-the-webauthn-api-a-bare-bones-js-app/



let aa;
let bb;

///////// START UTIL FUNCTIONS /////////
// easy way to go from string to ByteArray and back again
const te = new TextEncoder();
const td = new TextDecoder();

// another function to go from string to ByteArray, but we first encode the
// string as base64 - note the use of the atob() function
function strToBin(str) {
  return Uint8Array.from(atob(str), (c) => c.charCodeAt(0));
}

// function to encode raw binary to string, which is subsequently
// encoded to base64 - note the use of the btoa() function
function binToStr(bin) {
  return btoa(
    new Uint8Array(bin).reduce((s, byte) => s + String.fromCharCode(byte), "")
  );
}
///////// END UTIL FUNCTIONS /////////

///////// START WEBAUTHN FUNCTIONS /////////

////// START server generated info //////
// the below "publicKey" variable is typically generated by your server - here for DEMO purposes only
const AUTH_CHALLENGE_CREATE = "someRandomString";
const publicKeyCreate = {
  // random, cryptographically secure, at least 16 bytes
  challenge: te.encode(AUTH_CHALLENGE_CREATE),
  // relying party
  rp: {
    // sample relying party
    name: "Authenticator Anywhere",
    id: "cdpn.io"
  },
  user: {
    id: te.encode("Authenticator Anywhere"), //
    name: "Authenticator Anywhere",
    displayName: "Authenticator Anywhere"
  },
  //authenticatorSelection: {
  //authenticatorAttachment: "platform",
  //userVerification: "preferred",
  //},
  // attestation: "direct",
  pubKeyCredParams: [
    {
      type: "public-key",
      alg: -7 // "ES256" IANA COSE Algorithms registry
    }
  ]
};
////// END server generated info //////

//device's authenticator will chose a unique id, create a private/public key pair, sign the challenge, and send the signed challange and public key to the server 
async function createCreds() {
  
  if (window.PublicKeyCredential &&
    typeof PublicKeyCredential.getClientCapabilities === 'function') {
    const caps = await PublicKeyCredential.getClientCapabilities("public-key");
    if (caps.extensions?.includes("prf")) {
        console.log("This browser supports the PRF extension.");
      document.getElementById("message").innerHTML = "This browser supports the PRF extension.";
    }
    else{
       console.log("This browser does not support the PRF extension.");
       document.getElementById("message").innerHTML = "This browser does not support the PRF extension.";
    }
}
  
  // browser receives the publicKey object and passes it to WebAuthn "create" API
  const res = await navigator.credentials.create({
    publicKey: publicKeyCreate
  });
  aa = res.toJSON();
  let clientDataJSON = td.decode(res.response.clientDataJSON);
  // attestationObject sends back our public key
  let attestationObject = binToStr(res.response.attestationObject);
  console.log(res);
  // Below two lines store the most important info - the ID representing the created credentials
  // Typically they are sent via POST to your server, not stored locally - here for DEMO purposes only
  let rawid = binToStr(res.rawId);
    let rawid2 = td.decode(res.rawId);
  localStorage.setItem("rawId", rawid);
}

////// START server generated info //////
// Usually the below publicKey object is constructed on your server
// here for DEMO purposes only

const AUTH_CHALLENGE_VALIDATE = "someRandomString2";
const publicKeyValidate = {
  // your domain
  rpId: "cdpn.io",
  // random, cryptographically secure, at least 16 bytes
  challenge: te.encode(AUTH_CHALLENGE_VALIDATE),
  allowCredentials: [
    {
      id: "",
      type: "public-key"
    }
  ],
  mediation: "identity"
  //authenticatorSelection: {      userVerification: "preferred"   }
};
////// END server generated info //////

//get locally stored id to find local private hey in authenticator
//sign server challage and send it back to server, allong with some other response data
async function validateCreds() {
  const rawId = localStorage.getItem("rawId");
  if(! rawId){
    return false;
  }

  publicKeyValidate.allowCredentials[0].id = strToBin(rawId);
  
/*
  publicKeyValidate.allowCredentials[0].id = strToBin(rawId);
  // browser receives the publicKey object and passes it to WebAuthn "get" API
  const res = await navigator.credentials.get({
    publicKey: publicKeyValidate
  });
  win(res);
*/
  let res;
  navigator.credentials.get({
    publicKey: publicKeyValidate
  }).then(
  function(res) {
    bb = res.toJSON();
    //let cc = AuthenticatorAttestationResponse.getPublicKey() ;
    win(res);
  } , 
  function(error) {
    let b = error;
    }
);
  
}

function win(res){
   console.log(res);
  // here we build an object containing the results, to be sent to the server
  // usually "extractedData" is POSTed to your server
  const extractedData = {
    id: res.id,
    rawId: binToStr(res.rawId),
    clientDataJSON: binToStr(res.response.clientDataJSON)
  };
  // Usually done on the server, this is where you make your auth checks
  // here for DEMO purposes only
  const dataFromClient = JSON.parse(atob(extractedData.clientDataJSON));
  const retrievedChallenge = atob(dataFromClient.challenge);
  const retrievedOrigin = dataFromClient.origin;
  // At MINIMUM, your auth checks should be:
  // 1. Check that the retrieved challenge matches the auth challenge you sent to the client, as we do trivially below
  // 2. Check that "retrievedOrigin" matches your domain - otherwise this might be a phish - not shown here
  console.log(retrievedChallenge);
  if (retrievedChallenge == AUTH_CHALLENGE_VALIDATE) {
    alert("Authorized");
  } else {
    alert("Unauthorized");
  }
}
